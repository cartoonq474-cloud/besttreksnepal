<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="horizSun" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E88C38"/>
      <stop offset="100%" stop-color="#F2A65A"/>
    </linearGradient>
    <linearGradient id="horizSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEEDF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="horizClip">
      <circle cx="50" cy="50" r="42"/>
    </clipPath>
    <style>
      .h-title {
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
        font-weight: 900;
        font-size: 24px;
        fill: #0F5257;
        letter-spacing: 0.5px;
      }
      .h-est {
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
        font-weight: 700;
        font-size: 8px;
        fill: #7FB3B0;
        letter-spacing: 2.2px;
      }
      .h-tagline {
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
        font-weight: 800;
        font-size: 10px;
        fill: #F2A65A;
        letter-spacing: 3.8px;
      }
    </style>
  </defs>

  <!-- ================= LEFT DETAILED EMBLEM ================= -->
  <g transform="translate(6, 0)">
    <!-- Outer Crest Ring -->
    <circle cx="50" cy="50" r="46" stroke="#0F5257" stroke-width="1.8" fill="none"/>
    <circle cx="50" cy="50" r="42" stroke="#7FB3B0" stroke-width="0.8" stroke-dasharray="2,2" fill="#FFFFFF"/>

    <!-- Compass Points -->
    <polygon points="50,0 52,6 50,4 48,6" fill="#0F5257"/>
    <polygon points="50,100 52,94 50,96 48,94" fill="#0F5257"/>
    <polygon points="98,50 92,52 94,50 92,48" fill="#0F5257"/>
    <polygon points="2,50 8,52 6,50 8,48" fill="#0F5257"/>

    <g clip-path="url(#horizClip)">
      <rect x="0" y="0" width="100" height="100" fill="url(#horizSky)"/>

      <!-- Sunburst Rays -->
      <g stroke="#F2A65A" stroke-width="0.7" opacity="0.65">
        <line x1="50" y1="36" x2="50" y2="8"/>
        <line x1="50" y1="36" x2="59" y2="9"/>
        <line x1="50" y1="36" x2="68" y2="13"/>
        <line x1="50" y1="36" x2="76" y2="20"/>
        <line x1="50" y1="36" x2="81" y2="29"/>
        <line x1="50" y1="36" x2="41" y2="9"/>
        <line x1="50" y1="36" x2="32" y2="13"/>
        <line x1="50" y1="36" x2="24" y2="20"/>
        <line x1="50" y1="36" x2="19" y2="29"/>
      </g>

      <!-- Glowing Rising Sun -->
      <circle cx="50" cy="36" r="17" fill="url(#horizSun)"/>

      <!-- Prayer Flags Bunting -->
      <path d="M12,22 Q50,34 88,22" stroke="#0F5257" stroke-width="0.6" fill="none"/>
      <polygon points="18,22 22,23 21,27 17,26" fill="#2563EB"/>
      <polygon points="24,24 28,25 27,29 23,28" fill="#FFFFFF" stroke="#0F5257" stroke-width="0.3"/>
      <polygon points="30,26 34,27 33,31 29,30" fill="#DC2626"/>
      <polygon points="36,28 40,29 39,33 35,32" fill="#16A34A"/>
      <polygon points="42,30 46,31 45,35 41,34" fill="#EAB308"/>
      <polygon points="48,31 52,31 52,35 48,35" fill="#2563EB"/>
      <polygon points="54,31 58,30 59,34 55,35" fill="#DC2626"/>
      <polygon points="60,29 64,28 65,32 61,33" fill="#16A34A"/>
      <polygon points="66,27 70,26 71,30 67,31" fill="#EAB308"/>
      <polygon points="72,25 76,24 77,28 73,29" fill="#2563EB"/>
      <polygon points="78,23 82,22 83,26 79,27" fill="#DC2626"/>

      <!-- Peaks -->
      <polygon points="10,75 30,40 50,75" fill="#7FB3B0" opacity="0.6"/>
      <polygon points="55,75 75,38 95,75" fill="#7FB3B0" opacity="0.6"/>

      <!-- Left Peak -->
      <polygon points="8,80 30,42 52,80" fill="#0F5257"/>
      <polygon points="30,42 52,80 30,80" fill="#0A3E42" opacity="0.5"/>
      <polygon points="30,42 22,52 27,50 30,55 34,50 38,54 30,42" fill="#FFFFFF"/>

      <!-- Right Peak -->
      <polygon points="48,80 70,40 92,80" fill="#0F5257"/>
      <polygon points="70,40 92,80 70,80" fill="#0A3E42" opacity="0.6"/>
      <polygon points="70,40 63,51 67,49 70,54 74,48 78,53 70,40" fill="#FFFFFF"/>

      <!-- Center Main Summit -->
      <polygon points="22,85 50,22 78,85" fill="#0F5257"/>
      <polygon points="50,22 50,85 78,85" fill="#0A3E42" opacity="0.45"/>
      <polygon points="50,22 42,38 46,35 49,41 52,36 55,39 59,34 50,22" fill="#FFFFFF"/>
      <polygon points="50,22 42,38 36,50 42,48 44,56 49,49 50,58 50,22" fill="#FFFFFF"/>
      <polygon points="42,48 32,64 38,60 41,72 44,56" fill="#FFFFFF" opacity="0.95"/>
      <polygon points="50,22 52,36 55,47 50,55 50,22" fill="#FFFFFF" opacity="0.9"/>
      <polygon points="55,47 62,59 58,67 50,75 50,55" fill="#E2F1F0" opacity="0.75"/>

      <!-- Valley Slopes -->
      <path d="M5,72 Q35,70 45,82 L45,100 L5,100 Z" fill="#0D4B50"/>
      <path d="M95,72 Q65,70 55,82 L55,100 L95,100 Z" fill="#0D4B50"/>

      <!-- Trail -->
      <path d="M50,72 Q52,78 47,83 Q42,88 52,93 Q58,97 45,100" stroke="#FCEEDF" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M50,72 Q52,78 47,83 Q42,88 52,93 Q58,97 45,100" stroke="#F2A65A" stroke-width="1.2" stroke-dasharray="1.8,2" fill="none"/>

      <!-- Trekker -->
      <g transform="translate(49, 87)">
        <circle cx="0" cy="-5.5" r="1.2" fill="#0F5257"/>
        <path d="M-1,-4 C-1,-4 -2.5,-3.5 -2.5,-1.5 C-2.5,0 -1.8,0.5 -0.8,0.5 L0.8,0.5 L0.8,-4 Z" fill="#0F5257"/>
        <line x1="-0.4" y1="0.5" x2="-1.5" y2="4.5" stroke="#0F5257" stroke-width="1" stroke-linecap="round"/>
        <line x1="0.4" y1="0.5" x2="1.5" y2="4.2" stroke="#0F5257" stroke-width="1" stroke-linecap="round"/>
        <line x1="0.8" y1="-2" x2="2.4" y2="4.5" stroke="#0F5257" stroke-width="0.7" stroke-linecap="round"/>
        <line x1="-0.8" y1="-2" x2="-2.4" y2="4.2" stroke="#0F5257" stroke-width="0.7" stroke-linecap="round"/>
      </g>

      <!-- Pines Left -->
      <g transform="translate(18, 75)">
        <polygon points="0,-9 2,-5 -2,-5" fill="#0F5257"/>
        <polygon points="0,-6 2.5,-2 -2.5,-2" fill="#0F5257"/>
        <polygon points="0,-3 3,1 -3,1" fill="#0F5257"/>
      </g>
      <g transform="translate(26, 78)">
        <polygon points="0,-11 2.5,-6 -2.5,-6" fill="#0A3E42"/>
        <polygon points="0,-7 3.2,-2 -3.2,-2" fill="#0A3E42"/>
        <polygon points="0,-3 4,2 -4,2" fill="#0A3E42"/>
      </g>
      <!-- Pines Right -->
      <g transform="translate(82, 75)">
        <polygon points="0,-9 2,-5 -2,-5" fill="#0F5257"/>
        <polygon points="0,-6 2.5,-2 -2.5,-2" fill="#0F5257"/>
        <polygon points="0,-3 3,1 -3,1" fill="#0F5257"/>
      </g>
      <g transform="translate(74, 78)">
        <polygon points="0,-11 2.5,-6 -2.5,-6" fill="#0A3E42"/>
        <polygon points="0,-7 3.2,-2 -3.2,-2" fill="#0A3E42"/>
        <polygon points="0,-3 4,2 -4,2" fill="#0A3E42"/>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT TYPOGRAPHY ================= -->
  <g transform="translate(125, 0)">
    <!-- Subtitle Badge -->
    <g transform="translate(0, 22)">
      <rect x="0" y="-8" width="168" height="12" rx="2" fill="#FCEEDF"/>
      <text x="6" y="1" class="h-est">EST. 2009 · HIMALAYAN EXPEDITIONS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="48" class="h-title">BEST TREKS NEPAL</text>

    <!-- Mountain Divider Accent Line with Peak & Compass Star -->
    <path d="M0,58 L85,58 L92,51 L97,58 L101,54 L105,58 L280,58" stroke="#F2A65A" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
    <circle cx="92" cy="51" r="1.5" fill="#0F5257"/>

    <!-- Tagline -->
    <text x="2" y="74" class="h-tagline">ADVENTURE AWAITS</text>
  </g>
</svg>
