<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iconSun" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E88C38"/>
      <stop offset="100%" stop-color="#F2A65A"/>
    </linearGradient>
    <linearGradient id="iconSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEEDF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="iconClip">
      <circle cx="100" cy="80" r="72"/>
    </clipPath>
  </defs>

  <!-- Outer Crest Ring -->
  <circle cx="100" cy="80" r="76" stroke="#0F5257" stroke-width="1.8" fill="none"/>
  <circle cx="100" cy="80" r="72" stroke="#7FB3B0" stroke-width="0.8" stroke-dasharray="2,2" fill="#FFFFFF"/>

  <!-- Compass Star North/South/East/West Accents -->
  <polygon points="100,2 103,10 100,8 97,10" fill="#0F5257"/>
  <polygon points="100,158 103,150 100,152 97,150" fill="#0F5257"/>
  <polygon points="178,80 170,83 172,80 170,77" fill="#0F5257"/>
  <polygon points="22,80 30,83 28,80 30,77" fill="#0F5257"/>

  <g clip-path="url(#iconClip)">
    <!-- Sky Wash -->
    <rect x="20" y="5" width="160" height="150" fill="url(#iconSky)"/>

    <!-- Radiant Sunbeams -->
    <g stroke="#F2A65A" stroke-width="0.9" opacity="0.65">
      <line x1="100" y1="56" x2="100" y2="12"/>
      <line x1="100" y1="56" x2="114" y2="14"/>
      <line x1="100" y1="56" x2="128" y2="20"/>
      <line x1="100" y1="56" x2="140" y2="30"/>
      <line x1="100" y1="56" x2="148" y2="44"/>
      <line x1="100" y1="56" x2="153" y2="58"/>
      <line x1="100" y1="56" x2="86" y2="14"/>
      <line x1="100" y1="56" x2="72" y2="20"/>
      <line x1="100" y1="56" x2="60" y2="30"/>
      <line x1="100" y1="56" x2="52" y2="44"/>
      <line x1="100" y1="56" x2="47" y2="58"/>
    </g>

    <!-- Warm Glowing Sun -->
    <circle cx="100" cy="56" r="26" fill="url(#iconSun)"/>

    <!-- Prayer Flags Bunting Curve -->
    <path d="M36,36 Q100,54 164,36" stroke="#0F5257" stroke-width="0.8" fill="none"/>
    <polygon points="45,36 51,38 50,44 44,42" fill="#2563EB"/>
    <polygon points="53,39 59,41 58,47 52,45" fill="#FFFFFF" stroke="#0F5257" stroke-width="0.4"/>
    <polygon points="61,42 67,44 66,50 60,48" fill="#DC2626"/>
    <polygon points="69,45 75,47 74,53 68,51" fill="#16A34A"/>
    <polygon points="77,47 83,48 82,54 76,53" fill="#EAB308"/>
    <polygon points="85,49 91,50 90,56 84,55" fill="#2563EB"/>
    <polygon points="93,50 99,50 99,56 93,56" fill="#FFFFFF" stroke="#0F5257" stroke-width="0.4"/>
    <polygon points="101,50 107,50 107,56 101,56" fill="#DC2626"/>
    <polygon points="109,49 115,48 116,54 110,55" fill="#16A34A"/>
    <polygon points="117,47 123,45 124,51 118,53" fill="#EAB308"/>
    <polygon points="125,44 131,42 132,48 126,50" fill="#2563EB"/>
    <polygon points="133,41 139,39 140,45 134,47" fill="#FFFFFF" stroke="#0F5257" stroke-width="0.4"/>
    <polygon points="141,38 147,36 148,42 142,44" fill="#DC2626"/>
    <polygon points="149,35 155,33 156,39 150,41" fill="#16A34A"/>

    <!-- ================= MOUNTAINS ================= -->
    <!-- Far Background Ridge -->
    <polygon points="25,108 55,68 85,105" fill="#7FB3B0" opacity="0.6"/>
    <polygon points="115,105 145,65 175,108" fill="#7FB3B0" opacity="0.6"/>

    <!-- Left Peak -->
    <polygon points="20,118 55,60 90,115" fill="#0F5257"/>
    <polygon points="55,60 90,115 55,115" fill="#0A3E42" opacity="0.5"/>
    <polygon points="55,60 44,75 50,73 55,78 60,72 66,77 55,60" fill="#FFFFFF"/>
    <polygon points="55,60 44,75 36,88 47,83 51,94 55,78" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="44,75 40,90 32,102 38,98 44,88" fill="#E2F1F0" opacity="0.85"/>

    <!-- Right Peak -->
    <polygon points="110,115 145,58 180,118" fill="#0F5257"/>
    <polygon points="145,58 180,118 145,118" fill="#0A3E42" opacity="0.6"/>
    <polygon points="145,58 135,74 141,71 145,77 151,70 158,77 145,58" fill="#FFFFFF"/>
    <polygon points="145,58 151,70 162,86 156,88 165,102 145,77" fill="#FFFFFF" opacity="0.95"/>

    <!-- Center Main Summit (Ama Dablam Pyramid Peak) -->
    <polygon points="50,125 100,32 150,125" fill="#0F5257"/>
    <!-- Summit Shading -->
    <polygon points="100,32 100,125 150,125" fill="#0A3E42" opacity="0.45"/>
    <polygon points="100,32 122,80 110,92 132,125 100,125" fill="#072B2E" opacity="0.3"/>

    <!-- Crystalline Snow Facets -->
    <polygon points="100,32 88,56 94,52 98,60 103,53 108,57 114,50 100,32" fill="#FFFFFF"/>
    <polygon points="100,32 88,56 79,74 88,70 91,82 98,72 100,85 100,32" fill="#FFFFFF"/>
    <polygon points="88,70 73,95 82,90 86,108 91,82" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="79,74 65,104 74,99 74,115 82,90" fill="#E2F1F0" opacity="0.9"/>
    <!-- Glacial Couloirs -->
    <polygon points="100,32 103,53 107,68 100,80 100,32" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="107,68 116,86 110,98 100,110 100,80" fill="#FFFFFF" opacity="0.8"/>
    <polygon points="116,86 130,108 122,114 108,125 110,98" fill="#E2F1F0" opacity="0.75"/>

    <!-- Lateral Moraine Ridges -->
    <path d="M20,115 Q65,112 85,130 L85,160 L20,160 Z" fill="#0D4B50"/>
    <path d="M180,115 Q135,112 115,130 L115,160 L180,160 Z" fill="#0D4B50"/>

    <!-- Valley Slopes Base -->
    <path d="M15,135 C55,130 80,135 90,138 L90,160 L15,160 Z" fill="#093538"/>
    <path d="M185,135 C145,130 120,135 110,138 L110,160 L185,160 Z" fill="#093538"/>

    <!-- Winding Trail with Stepping Stones -->
    <path d="M99,114 Q103,122 95,130 Q87,138 103,146 Q112,152 92,160" stroke="#FCEEDF" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M99,114 Q103,122 95,130 Q87,138 103,146 Q112,152 92,160" stroke="#F2A65A" stroke-width="1.8" stroke-dasharray="2.5,3" fill="none"/>
    <circle cx="91" cy="134" r="2" fill="#7FB3B0"/>
    <circle cx="98" cy="140" r="2.2" fill="#7FB3B0"/>
    <circle cx="107" cy="148" r="2.5" fill="#7FB3B0"/>

    <!-- Trekker Silhouette on Trail -->
    <g transform="translate(98, 137)">
      <!-- Head & Cap -->
      <circle cx="0" cy="-8" r="1.8" fill="#0F5257"/>
      <path d="M-2.5,-8.5 L2.5,-8.5 L1.8,-7.2 L-1.8,-7.2 Z" fill="#0F5257"/>
      <!-- Body & Pack -->
      <path d="M-1.5,-6 C-1.5,-6 -3.5,-5.5 -3.5,-2.5 C-3.5,0 -2.5,0.8 -1.2,0.8 L1.2,0.8 L1.2,-6 Z" fill="#0F5257"/>
      <path d="M-0.6,-6 L1.8,-6 L1.8,0.8 L-0.6,0.8 Z" fill="#0A3E42"/>
      <!-- Legs -->
      <line x1="-0.6" y1="0.8" x2="-2.2" y2="6.5" stroke="#0F5257" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="0.6" y1="0.8" x2="2.2" y2="6" stroke="#0F5257" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Poles -->
      <line x1="1.2" y1="-3" x2="3.5" y2="6.5" stroke="#0F5257" stroke-width="0.9" stroke-linecap="round"/>
      <line x1="-1.2" y1="-3" x2="-3.5" y2="6.2" stroke="#0F5257" stroke-width="0.9" stroke-linecap="round"/>
    </g>

    <!-- Pine Forests Left Flank -->
    <g transform="translate(32, 118)">
      <polygon points="0,-14 3,-9 -3,-9" fill="#0A3E42"/>
      <polygon points="0,-10 4,-4 -4,-4" fill="#0A3E42"/>
      <polygon points="0,-5 5,1 -5,1" fill="#0A3E42"/>
      <rect x="-0.8" y="1" width="1.6" height="4" fill="#072B2E"/>
    </g>
    <g transform="translate(43, 114)">
      <polygon points="0,-18 3.5,-11 -3.5,-11" fill="#0F5257"/>
      <polygon points="0,-13 4.5,-6 -4.5,-6" fill="#0F5257"/>
      <polygon points="0,-7 6,1 -6,1" fill="#0F5257"/>
      <rect x="-1" y="1" width="2" height="4.5" fill="#072B2E"/>
    </g>
    <g transform="translate(54, 122)">
      <polygon points="0,-15 3,-9 -3,-9" fill="#0A3E42"/>
      <polygon points="0,-11 4,-4 -4,-4" fill="#0A3E42"/>
      <polygon points="0,-6 5,1 -5,1" fill="#0A3E42"/>
      <rect x="-0.8" y="1" width="1.6" height="4" fill="#072B2E"/>
    </g>
    <g transform="translate(65, 128)">
      <polygon points="0,-13 3,-8 -3,-8" fill="#0F5257"/>
      <polygon points="0,-9 3.8,-3 -3.8,-3" fill="#0F5257"/>
      <polygon points="0,-4 4.5,1 -4.5,1" fill="#0F5257"/>
      <rect x="-0.7" y="1" width="1.4" height="3" fill="#072B2E"/>
    </g>

    <!-- Pine Forests Right Flank -->
    <g transform="translate(168, 118)">
      <polygon points="0,-14 3,-9 -3,-9" fill="#0A3E42"/>
      <polygon points="0,-10 4,-4 -4,-4" fill="#0A3E42"/>
      <polygon points="0,-5 5,1 -5,1" fill="#0A3E42"/>
      <rect x="-0.8" y="1" width="1.6" height="4" fill="#072B2E"/>
    </g>
    <g transform="translate(157, 114)">
      <polygon points="0,-18 3.5,-11 -3.5,-11" fill="#0F5257"/>
      <polygon points="0,-13 4.5,-6 -4.5,-6" fill="#0F5257"/>
      <polygon points="0,-7 6,1 -6,1" fill="#0F5257"/>
      <rect x="-1" y="1" width="2" height="4.5" fill="#072B2E"/>
    </g>
    <g transform="translate(146, 122)">
      <polygon points="0,-15 3,-9 -3,-9" fill="#0A3E42"/>
      <polygon points="0,-11 4,-4 -4,-4" fill="#0A3E42"/>
      <polygon points="0,-6 5,1 -5,1" fill="#0A3E42"/>
      <rect x="-0.8" y="1" width="1.6" height="4" fill="#072B2E"/>
    </g>
    <g transform="translate(135, 128)">
      <polygon points="0,-13 3,-8 -3,-8" fill="#0F5257"/>
      <polygon points="0,-9 3.8,-3 -3.8,-3" fill="#0F5257"/>
      <polygon points="0,-4 4.5,1 -4.5,1" fill="#0F5257"/>
      <rect x="-0.7" y="1" width="1.4" height="3" fill="#072B2E"/>
    </g>
  </g><!-- /clip -->

  <!-- Bottom Accent Plaque -->
  <g transform="translate(100, 150)">
    <polygon points="0,-5 32,-5 38,0 32,5 -32,5 -38,0 -32,-5" fill="#0F5257" stroke="#F2A65A" stroke-width="0.8"/>
    <!-- Mini Mountain Peak -->
    <polygon points="0,-3 4,1 -4,1" fill="#F2A65A"/>
  </g>
</svg>
