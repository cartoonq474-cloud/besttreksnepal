<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favSun" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E88C38"/>
      <stop offset="100%" stop-color="#F2A65A"/>
    </linearGradient>
    <clipPath id="favClip">
      <circle cx="32" cy="32" r="28"/>
    </clipPath>
  </defs>
  <!-- Base Disc -->
  <circle cx="32" cy="32" r="31" fill="#0F5257" stroke="#F2A65A" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="28" stroke="#7FB3B0" stroke-width="0.7" stroke-dasharray="1.5,1.5" fill="#0A3E42"/>

  <!-- Compass N/S/E/W Marks -->
  <polygon points="32,1 33.5,4 32,3 30.5,4" fill="#F2A65A"/>
  <polygon points="32,63 33.5,60 32,61 30.5,60" fill="#F2A65A"/>
  <polygon points="63,32 60,33.5 61,32 60,30.5" fill="#F2A65A"/>
  <polygon points="1,32 4,33.5 3,32 4,30.5" fill="#F2A65A"/>

  <g clip-path="url(#favClip)">
    <!-- Sunburst -->
    <circle cx="32" cy="22" r="12" fill="url(#favSun)"/>
    <line x1="32" y1="22" x2="32" y2="4" stroke="#F2A65A" stroke-width="0.8" opacity="0.6"/>
    <line x1="32" y1="22" x2="44" y2="10" stroke="#F2A65A" stroke-width="0.8" opacity="0.6"/>
    <line x1="32" y1="22" x2="20" y2="10" stroke="#F2A65A" stroke-width="0.8" opacity="0.6"/>

    <!-- Prayer Flags -->
    <path d="M8,14 Q32,22 56,14" stroke="#FFFFFF" stroke-width="0.5" opacity="0.8" fill="none"/>
    <polygon points="14,15 17,16 16,19 13,18" fill="#60A5FA"/>
    <polygon points="19,17 22,18 21,21 18,20" fill="#FFFFFF"/>
    <polygon points="24,19 27,19 26,22 23,22" fill="#F87171"/>
    <polygon points="29,20 32,20 32,23 29,23" fill="#4ADE80"/>
    <polygon points="34,20 37,20 37,23 34,23" fill="#FACC15"/>
    <polygon points="39,19 42,19 43,22 40,22" fill="#60A5FA"/>
    <polygon points="44,18 47,17 48,20 45,21" fill="#FFFFFF"/>
    <polygon points="49,16 52,15 53,18 50,19" fill="#F87171"/>

    <!-- Mountain Peaks -->
    <polygon points="10,48 24,24 38,48" fill="#7FB3B0" opacity="0.6"/>
    <polygon points="26,48 40,22 54,48" fill="#7FB3B0" opacity="0.6"/>

    <!-- Center Summit -->
    <polygon points="14,52 32,14 50,52" fill="#FFFFFF"/>
    <polygon points="32,14 32,52 50,52" fill="#7FB3B0" opacity="0.45"/>
    <!-- Facets -->
    <polygon points="32,14 26,26 30,24 32,28 35,23 38,27 32,14" fill="#FFFFFF"/>
    <polygon points="26,26 21,38 25,35 27,42 32,32" fill="#FFFFFF"/>

    <!-- Trail & Trekker -->
    <path d="M31,44 Q33,48 29,52 Q26,56 32,60" stroke="#F2A65A" stroke-width="1.8" fill="none"/>
    <circle cx="31" cy="48" r="1.4" fill="#FFFFFF"/>
    <line x1="31" y1="49" x2="31" y2="54" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>
</svg>
